apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: autonomous-cfo-build
parameters:
  - name: SOURCE_REPOSITORY
    value: https://github.com/docRonal/Kernes-AI.git
  - name: SOURCE_REF
    description: Git commit to build.
    required: true
  - name: IMAGE_TAG
    description: ImageStream tag for this commit.
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: autonomous-cfo
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: autonomous-cfo
    spec:
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: "${SOURCE_REPOSITORY}"
          ref: "${SOURCE_REF}"
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Containerfile
      output:
        to:
          kind: ImageStreamTag
          name: "autonomous-cfo:${IMAGE_TAG}"
