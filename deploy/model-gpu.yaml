# Qwen2.5 7B Instruct served by vLLM on the cluster's NVIDIA L4 GPU.
# The model comes from Red Hat's modelcar catalog, so no download token is needed.
# The cluster has one GPU: stop any other GPU model before applying this.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: kernes-vllm-gpu
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/template-name: vllm-cuda-runtime-template
    opendatahub.io/template-display-name: vLLM NVIDIA GPU ServingRuntime for KServe
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4
      command: [python, -m, vllm.entrypoints.openai.api_server]
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: kernes-qwen-7b
  labels:
    opendatahub.io/dashboard: "true"
    networking.knative.dev/visibility: cluster-local
  annotations:
    openshift.io/display-name: Kernes Qwen2.5 7B Instruct (vLLM, GPU)
    opendatahub.io/model-type: generative
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    automountServiceAccountToken: false
    minReplicas: 1
    maxReplicas: 1
    # One GPU: stop the old pod before starting the new one, or the rollout waits forever.
    deploymentStrategy:
      type: Recreate
    model:
      runtime: kernes-vllm-gpu
      modelFormat:
        name: vLLM
      storageUri: oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-7b-instruct
      args:
        - --dtype=half
        # The L4 supports FP8: half the weight bytes per token, so roughly twice the speed.
        - --quantization=fp8
        - --max-model-len=8192
        - --gpu-memory-utilization=0.92
      resources:
        requests:
          cpu: "2"
          memory: 12Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
